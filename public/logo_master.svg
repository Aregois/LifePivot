      <stop offset="100%" stop-color="color-mix(in srgb, var(--color-neon-violet, #d946ef) 68%, #1e0728)" />
    </linearGradient>

    <linearGradient id="lp-rim-main" x1="35" y1="360" x2="320" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="color-mix(in srgb, var(--color-electric-blue, #00f0ff) 52%, #ffffff)" />
      <stop offset="45%" stop-color="color-mix(in srgb, var(--color-electric-blue, #00f0ff) 52%, #ffffff)" />
      <stop offset="100%" stop-color="color-mix(in srgb, var(--color-neon-violet, #d946ef) 55%, #ffd6f5)" />
    </linearGradient>
    <linearGradient id="lp-rim-arrow" x1="280" y1="240" x2="500" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="color-mix(in srgb, var(--color-neon-violet, #d946ef) 55%, #ffd6f5)" />
      <stop offset="42%" stop-color="color-mix(in srgb, var(--color-neon-violet, #d946ef) 55%, #ffd6f5)" />
      <stop offset="100%" stop-color="color-mix(in srgb, var(--color-electric-blue, #00f0ff) 52%, #ffffff)" />
    </linearGradient>
    <linearGradient id="lp-rim-arc" x1="220" y1="355" x2="425" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="color-mix(in srgb, var(--color-electric-blue, #00f0ff) 52%, #ffffff)" />
      <stop offset="100%" stop-color="color-mix(in srgb, var(--color-neon-violet, #d946ef) 55%, #ffd6f5)" />
    </linearGradient>

    <filter id="lp-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

