<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 45 500 340" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="lp-body-main" x1="35" y1="360" x2="310" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="color-mix(in srgb, var(--color-electric-blue, #00f0ff) 68%, #0a0d24)" />
      <stop offset="48%" stop-color="color-mix(in srgb, var(--color-electric-blue, #00f0ff) 34%, color-mix(in srgb, var(--color-neon-violet, #d946ef) 66%, #140a2e))" />
      <stop offset="100%" stop-color="color-mix(in srgb, var(--color-neon-violet, #d946ef) 68%, #1e0728)" />
    </linearGradient>
    <linearGradient id="lp-body-arrow" x1="280" y1="240" x2="495" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="color-mix(in srgb, var(--color-neon-violet, #d946ef) 68%, #1e0728)" />
      <stop offset="55%" stop-color="color-mix(in srgb, var(--color-electric-blue, #00f0ff) 34%, color-mix(in srgb, var(--color-neon-violet, #d946ef) 66%, #140a2e))" />
      <stop offset="100%" stop-color="color-mix(in srgb, var(--color-electric-blue, #00f0ff) 68%, #0a0d24)" />
    </linearGradient>
    <linearGradient id="lp-body-arc" x1="220" y1="355" x2="425" y2="190" gradientUnits="userSpaceOnUse">
